name: XAUUSD Gold 15M Screener

on:
  schedule:
    # Mon-Fri, every 30 minutes
    # 1:00 PM IST to 10:30 PM IST
    - cron: '*/30 7-17 * * 1-5'

  # Manual Run button
  workflow_dispatch:

jobs:
  gold-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan Gold Setup
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python xauusd_bot_v2.py